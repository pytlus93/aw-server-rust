name: Project tracking checks

on:
  workflow_dispatch:
  push:
    branches: ['codex/project-tracking-stage1']
  pull_request:
    paths:
      - 'aw-projects/**'
      - 'aw-datastore/**'
      - 'aw-server/**'
      - 'Cargo.*'
      - '.github/workflows/project-tracking.yml'

permissions:
  contents: read

jobs:
  domain-and-api:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check module formatting
        run: cargo fmt -p aw-projects -p aw-datastore -p aw-server --check
      - name: Domain and persistence tests
        run: cargo test -p aw-projects -p aw-datastore --locked
      - name: Project HTTP tests
        run: cargo test -p aw-server --test projects_api --locked
      - name: Existing server API regression tests
        run: cargo test -p aw-server --test api --locked
      - name: Scoped Clippy
        run: cargo clippy -p aw-projects -p aw-datastore --lib --test projects --locked -- -D warnings
      - name: Server API Clippy (unchanged dependency lints excluded)
        run: cargo clippy -p aw-server --lib --test projects_api --no-deps --locked -- -D warnings
