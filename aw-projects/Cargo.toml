[package]
name = "aw-projects"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Project tracking domain rules for ActivityWatch"

[dependencies]
chrono-tz = "0.10"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1", features = ["serde", "v4"] }
